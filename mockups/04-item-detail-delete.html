<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cache — Item Detail &amp; Delete</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>body{background:#f0f0f0; margin:0; padding:2rem;}</style>
</head>
<body>
<div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap; font-family:Inter,sans-serif;">

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">Item detail</p>
<div style="background:#FDF6ED; border-radius:16px; overflow:hidden; color:#260503;">
<div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid rgba(38,5,3,0.1);">
<i class="ti ti-arrow-left" style="font-size:16px;"></i>
<span style="font-family:Unbounded,sans-serif; font-weight:900; font-size:13px;">cache</span>
<i class="ti ti-dots-vertical" style="font-size:16px;"></i>
</div>
<div style="width:100%; aspect-ratio:1/1; background:#e3d9c9;"></div>
<div style="padding:16px 18px;">
<p style="font-size:15px; font-weight:600; margin:0;">Vintage Chronograph</p>
<p style="font-size:11px; color:#6b6b6b; margin:4px 0 12px;">Junghans · Added Oct 24</p>
<div style="display:flex; gap:14px; padding:10px 0; border-top:1px solid rgba(38,5,3,0.1);">
<div><p style="font-size:9px; color:#6b6b6b; margin:0;">PURCHASE</p><p style="font-size:13px; font-weight:600; margin:2px 0 0;">$450</p></div>
<div><p style="font-size:9px; color:#6b6b6b; margin:0;">RESALE EST.</p><p style="font-size:13px; font-weight:600; color:#C91B46; margin:2px 0 0;">$270</p></div>
</div>
<span style="display:inline-block; margin-top:8px; padding:4px 10px; background:#6E8243; color:#fff; border-radius:999px; font-size:9px;">Watches</span>
</div>
</div>
<p style="font-size:10px; color:#888; text-align:center; margin-top:6px;">Category tag = olive-lime, per updated color-role rules</p>
</div>

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">⋮ menu open</p>
<div style="background:#FDF6ED; border-radius:16px; overflow:hidden; color:#260503; position:relative; min-height:300px;">
<div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid rgba(38,5,3,0.1);">
<i class="ti ti-arrow-left" style="font-size:16px;"></i>
<span style="font-family:Unbounded,sans-serif; font-weight:900; font-size:13px;">cache</span>
<i class="ti ti-dots-vertical" style="font-size:16px;"></i>
</div>
<div style="position:absolute; top:52px; right:18px; background:#ffffff; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.12); overflow:hidden; width:130px;">
<div style="display:flex; align-items:center; gap:8px; padding:12px 14px; color:#E76607;"><i class="ti ti-trash" style="font-size:14px;"></i><span style="font-size:12px; font-weight:500;">Delete item</span></div>
</div>
<div style="width:100%; aspect-ratio:1/1; background:#e3d9c9; opacity:0.4;"></div>
</div>
</div>

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">Delete confirmation</p>
<div style="min-height:300px; background:rgba(38,5,3,0.5); display:flex; align-items:center; justify-content:center; border-radius:16px;">
<div style="width:180px; background:#FDF6ED; border-radius:14px; padding:20px; text-align:center; color:#260503;">
<div style="width:40px; height:40px; background:#fbe4d3; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
<i class="ti ti-trash" style="font-size:18px; color:#E76607;"></i>
</div>
<p style="font-size:13px; font-weight:600; margin:0 0 6px;">Delete this item?</p>
<p style="font-size:10px; color:#6b6b6b; margin:0 0 16px;">This can't be undone.</p>
<button style="width:100%; height:38px; background:#E76607; color:#fff; border:none; border-radius:8px; font-size:11px; font-weight:600; margin-bottom:8px;">Delete item</button>
<button style="width:100%; height:38px; background:transparent; color:#260503; border:1px solid rgba(38,5,3,0.2); border-radius:8px; font-size:11px; font-weight:600;">Cancel</button>
</div>
</div>
</div>

</div>
</body>
</html>
