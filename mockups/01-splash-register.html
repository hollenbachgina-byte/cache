<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cache — Splash &amp; Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>body{background:#f0f0f0; margin:0; padding:2rem;}</style>
</head>
<body>
<div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap; font-family:Inter,sans-serif;">

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">Splash</p>
<div style="background:#FDF6ED; border-radius:16px; overflow:hidden; color:#260503; padding:28px 20px; text-align:center;">
<div style="width:100%; aspect-ratio:1/1; background:#3D5A48; border-radius:12px; margin-bottom:20px;"></div>
<span style="font-family:Unbounded,sans-serif; font-weight:900; font-size:26px;">cache</span>
<p style="font-size:12px; color:#6b6b6b; margin:8px 0 28px;">Your stuff has value. We help you see it.</p>
<button style="width:100%; height:44px; background:#C91B46; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600;">Create my Cache</button>
<p style="font-size:11px; margin-top:12px;">Already have an account? <span style="color:#3D5A48; font-weight:600;">Sign in</span></p>
</div>
</div>

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">Register</p>
<div style="background:#FDF6ED; border-radius:16px; overflow:hidden; color:#260503;">
<div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid rgba(38,5,3,0.1);">
<i class="ti ti-arrow-left" style="font-size:16px;"></i>
<span style="font-family:Unbounded,sans-serif; font-weight:900; font-size:14px;">cache</span>
<div style="width:16px;"></div>
</div>
<div style="padding:22px 18px;">
<p style="font-size:16px; font-weight:600; margin:0 0 18px;">Create your Cache</p>
<label style="font-size:10px; font-weight:500; color:#6b6b6b;">Phone number</label>
<input style="width:100%; height:40px; background:#ffffff; border:1px solid rgba(38,5,3,0.2); border-radius:8px; padding:0 12px; font-size:12px; margin:4px 0 12px; box-sizing:border-box;" placeholder="(555) 123-4567">
<label style="font-size:10px; font-weight:500; color:#6b6b6b;">Password</label>
<input style="width:100%; height:40px; background:#ffffff; border:1px solid rgba(38,5,3,0.2); border-radius:8px; padding:0 12px; font-size:12px; margin:4px 0 12px; box-sizing:border-box;" placeholder="••••••••">
<label style="font-size:10px; font-weight:500; color:#6b6b6b;">Confirm password</label>
<input style="width:100%; height:40px; background:#ffffff; border:1px solid rgba(38,5,3,0.2); border-radius:8px; padding:0 12px; font-size:12px; margin:4px 0 18px; box-sizing:border-box;" placeholder="••••••••">
<button style="width:100%; height:44px; background:#C91B46; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600;">Create my Cache</button>
</div>
</div>
</div>

<div style="width:230px;">
<p style="font-size:11px; font-weight:600; color:#6b6b6b; text-align:center; margin:0 0 8px;">Register success</p>
<div style="background:#FDF6ED; border-radius:16px; overflow:hidden; color:#260503; padding:36px 20px; text-align:center;">
<div style="width:56px; height:56px; background:#3D5A48; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
<i class="ti ti-check" style="font-size:26px; color:#fff;"></i>
</div>
<p style="font-size:16px; font-weight:600; margin:0 0 8px;">Your Cache is ready</p>
<p style="font-size:12px; color:#6b6b6b; margin:0 0 24px;">Start adding what you own.</p>
<button style="width:100%; height:44px; background:#C91B46; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600;">See my Cache</button>
</div>
</div>

</div>
</body>
</html>
