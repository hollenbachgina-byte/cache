{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="header-bar">
  <a href="{{ url_for('auth.register') }}" class="back-link"><i class="ti ti-arrow-left"></i></a>
  <span class="wordmark" style="font-size:16px;">cache</span>
  <span style="width:16px;"></span>
</div>
<form method="post" action="{{ url_for('auth.login') }}" class="form-panel">
  <p style="font-size:18px; font-weight:600; margin:0 0 4px;">Welcome back</p>
  <p style="font-size:13px; color:var(--color-muted); margin:0 0 18px;">Sign in to see what your stuff is worth.</p>

  <div class="field-group">
    <label class="field-label" for="phone_number">Phone number</label>
    <input
      type="tel"
      id="phone_number"
      name="phone_number"
      class="field-input"
      placeholder="(555) 123-4567"
      value="{{ phone_number or '' }}"
      required
    >
  </div>

  <div class="field-group" style="margin-bottom:18px;">
    <label class="field-label" for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      class="field-input{{ ' has-error' if error }}"
      placeholder="••••••••"
      required
    >
    {% if error %}
    <p class="error-message"><i class="ti ti-alert-circle"></i>{{ error }}</p>
    {% endif %}
  </div>

  <button type="submit" class="btn-primary">Sign in</button>
  <p style="text-align:center; font-size:13px; color:var(--color-muted); margin:12px 0 0;">No account? <a href="{{ url_for('auth.register') }}" class="link-secondary">create one</a></p>
</form>
{% endblock %}
